# ESPHome 2026.10.1 gateway for several Olas fans on one CC1101 (ADR 0001).
# Include from a private profile. The profile resolves all !secret values and defines the
# `olas:` block with its fans. Compare with the installed configuration before flashing,
# and preserve Wi-Fi, API and OTA access.

substitutions:
  olas_components_path: ../../../components
  olas_node_name: olas-rf-gateway
  olas_friendly_name: Olas RF Gateway

packages:
  rf_proxy: !include packages/olas-rf-proxy.yaml

external_components:
  - source:
      type: local
      path: ${olas_components_path}
    components: [olas]

esphome:
  name: ${olas_node_name}
  friendly_name: ${olas_friendly_name}
  # The component uses remote_base and entity APIs of this release.
  min_version: 2026.10.1

esp32:
  variant: esp32s2
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  # Keep following the remotes while Home Assistant is away: a reboot would lose the
  # sequence and reset the fan estimates.
  reboot_timeout: 0s
  encryption:
    key: ${olas_api_encryption_key}

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: ${olas_wifi_ssid}
  password: ${olas_wifi_password}
  ap:
    ssid: ${olas_node_name} Fallback
    password: ${olas_fallback_ap_password}

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO11
  miso_pin: GPIO9

cc1101:
  cs_pin: GPIO12
  frequency: 434MHz
  modulation_type: ASK/OOK

remote_transmitter:
  id: olas_tx
  pin: GPIO5
  carrier_duty_percent: 100%
  non_blocking: true
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx

remote_receiver:
  id: rf_rx
  pin: GPIO3
  filter: 50us
  idle: 10ms
