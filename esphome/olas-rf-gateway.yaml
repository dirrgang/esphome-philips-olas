# ESPHome 2026.10.1 gateway; use a private profile for individual installations.
# Do NOT flash blindly over an existing HA device: preserve your API/OTA credentials,
# existing network configuration, and device-specific settings.
# Include from a profile; resolve all !secret values in that profile.

substitutions:
  olas_protocol_header: include/olas_protocol.h
  olas_control_enabled: "true"
  olas_fan_internal: "false"
  olas_light_internal: ${olas_fan_internal}
  olas_fan_id: "0x000000"
  olas_check_xor: "0x00"
  olas_node_name: olas-rf-gateway
  olas_friendly_name: Olas RF Gateway
  olas_fan_name: Philips Olas

packages:
  learning: !include packages/olas-learning.yaml
  rf_proxy: !include
    file: packages/olas-rf-proxy.yaml
    condition: ${olas_control_enabled}

esphome:
  name: ${olas_node_name}
  friendly_name: ${olas_friendly_name}
  includes:
    - ${olas_protocol_header}
  on_boot:
    priority: -100
    then:
      - globals.set:
          id: olas_ready
          value: "true"

esp32:
  variant: esp32s2
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: ${olas_api_encryption_key}

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: ${olas_wifi_ssid}
  password: ${olas_wifi_password}
  ap:
    ssid: ${olas_node_name} Fallback
    password: ${olas_fallback_ap_password}

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO11
  miso_pin: GPIO9

cc1101:
  cs_pin: GPIO12
  frequency: 434MHz
  modulation_type: ASK/OOK

remote_transmitter:
  id: olas_tx
  pin: GPIO5
  carrier_duty_percent: 100%
  non_blocking: true
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx

globals:
  - id: olas_ready
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: olas_white_preset
    type: int
    restore_value: no
    initial_value: '-1'

  - id: olas_seq
    type: uint8_t
    restore_value: no
    initial_value: '1'

  - id: olas_rf_update
    type: bool
    restore_value: no
    initial_value: 'false'

remote_receiver:
  id: rf_rx
  pin: GPIO3
  filter: 50us
  idle: 10ms
  # Raw dumping is deliberately disabled in normal operation.
  on_raw:
    then:
      - lambda: |-
          if (id(olas_learning_active)) {
            static bool have_learn_last = false;
            static uint64_t learn_last_frame = 0;
            static uint32_t learn_last_logged_ms = 0;
            size_t cursor = 0;
            olas::Frame candidate;
            while (olas::next_raw_candidate(x.data(), x.size(), cursor, candidate)) {
              const uint32_t now = millis();
              if (have_learn_last && candidate.raw == learn_last_frame &&
                  uint32_t(now - learn_last_logged_ms) < 400u)
                continue;
              have_learn_last = true;
              learn_last_frame = candidate.raw;
              learn_last_logged_ms = now;
              ESP_LOGI("olas.learn",
                       "RF candidate id=0x%06X function=0x%02X seq=%u check=0x%02X xor_candidate=0x%02X",
                       unsigned(candidate.fan_id), unsigned(candidate.function),
                       unsigned(candidate.sequence), unsigned(candidate.check),
                       unsigned(olas::candidate_check_xor(candidate)));
            }
          }
          if (!${olas_control_enabled})
            return;  // No configured-state updates while the RF target is unknown.
          constexpr uint32_t FAN_ID = ${olas_fan_id};
          constexpr uint8_t CHECK_XOR = ${olas_check_xor};
          olas::Frame frame;
          if (!olas::decode_raw(x.data(), x.size(), FAN_ID, CHECK_XOR, frame))
            return;

          // Several identical frames form a single physical key press.
          static uint64_t last_frame = 0;
          static uint32_t last_seen_ms = 0;
          static bool have_last = false;
          const uint32_t now = millis();
          if (have_last && frame.raw == last_frame &&
              uint32_t(now - last_seen_ms) < 400u)
            return;
          last_frame = frame.raw;
          last_seen_ms = now;
          have_last = true;

          // Synchronize next locally transmitted sequence after receiving
          // an external remote press. RX is disabled while our TX is active.
          id(olas_seq) = olas::next_sequence(frame.sequence);

          ESP_LOGI("olas", "RX function=0x%02X seq=%u",
                   unsigned(frame.function), unsigned(frame.sequence));

          // Publication is synchronous. Light output itself never transmits.
          olas::RfUpdateGuard guard(id(olas_rf_update));
          const int speed = olas::speed_for_function(frame.function);
          if (speed >= 0) {
            id(olas_fan).state = speed != 0;
            if (speed != 0)
              id(olas_fan).speed = speed;
            id(olas_fan).publish_state();
          } else if (frame.function == olas::LIGHT_ON || frame.function == olas::LIGHT_OFF) {
            const bool on = frame.function == olas::LIGHT_ON;
            id(olas_light).remote_values.set_state(on);
            id(olas_light).current_values.set_state(on);
            id(olas_light).publish_state();
          } else {
            const int preset = olas::white_preset(frame.function);
            if (preset >= 0) {
              id(olas_white_preset) = preset;
              id(olas_white).publish_state(id(olas_white).traits.get_options()[preset]);
            }
          }

script:
  - id: olas_send
    parameters:
      function: uint8_t
    then:
      - lambda: |-
          const uint8_t seq = id(olas_seq);
          if (!olas::send_command(*id(olas_tx), ${olas_fan_id}, ${olas_check_xor},
                                  id(olas_seq), function, ${olas_control_enabled},
                                  id(olas_ready), id(olas_rf_update)))
            return;
          ESP_LOGI("olas", "TX requested function=0x%02X seq=%u",
                   unsigned(function), unsigned(seq));
          const int preset = olas::white_preset(function);
          if (preset >= 0) {
            id(olas_white_preset) = preset;
            id(olas_white).publish_state(id(olas_white).traits.get_options()[preset]);
          }

fan:
  - platform: template
    id: olas_fan
    name: ${olas_fan_name}
    internal: ${olas_fan_internal}
    speed_count: 6
    on_state:
      then:
        - lambda: |-
            if (!${olas_control_enabled} || id(olas_rf_update))
              return;

            int speed = x->state ? x->speed : 0;
            if (x->state && speed == 0)
              speed = 1;
            if (speed < 0 || speed > 6)
              return;

            id(olas_send).execute(olas::function_for_speed(speed));

# LightState writes outputs later from loop(), after the scoped RX guard ends.
# Keep this output inert; RF belongs only to synchronous on_state publication.
output:
  - platform: template
    id: olas_light_output
    type: binary
    write_action:
      - lambda: 'return;'

light:
  - platform: binary
    id: olas_light
    name: "${olas_fan_name} Licht"
    internal: ${olas_light_internal}
    output: olas_light_output
    restore_mode: ALWAYS_OFF
    on_state:
      - lambda: |-
          id(olas_send).execute(id(olas_light).remote_values.is_on()
                               ? olas::LIGHT_ON : olas::LIGHT_OFF);

select:
  - platform: template
    id: olas_white
    name: "${olas_fan_name} Weißton"
    internal: ${olas_light_internal}
    options:
      - Warmweiß
      - Neutralweiß
      - Tageslichtweiß
    # No initial/restore option: unknown until commanded or heard.
    update_interval: never
    lambda: |-
      const int preset = id(olas_white_preset);
      if (preset < 0)
        return {};
      return id(olas_white).traits.get_options()[preset];
    set_action:
      - lambda: |-
          const auto &options = id(olas_white).traits.get_options();
          for (size_t i = 0; i < options.size(); ++i) {
            if (x == options[i]) {
              id(olas_send).execute(olas::WHITE_PRESETS[i]);
              return;
            }
          }
