name: Sync issue label definitions

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
      - ".github/workflows/sync-labels.yml"
  workflow_dispatch:

permissions: {}

# Serialize label syncs; never cancel a half-finished run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # create/update repository labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Uses the preinstalled gh CLI instead of a third-party script action.
      # `--force` updates existing labels; labels missing from the file are kept.
      - name: Create or update labels (no deletions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while IFS= read -r label; do
            name="$(jq -r '.name' <<<"$label")"
            gh label create "$name" \
              --repo "$GITHUB_REPOSITORY" \
              --color "$(jq -r '.color' <<<"$label")" \
              --description "$(jq -r '.description' <<<"$label")" \
              --force
            echo "Synced label: $name"
          done
