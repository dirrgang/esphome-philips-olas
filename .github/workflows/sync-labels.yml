name: Sync issue label definitions

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
      - ".github/workflows/sync-labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update labels (no deletions)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const labels = JSON.parse(fs.readFileSync(".github/labels.json", "utf8"));
            for (const label of labels) {
              const repo = context.repo;
              const params = { ...repo, name: label.name, color: label.color, description: label.description };
              try {
                await github.rest.issues.getLabel({ ...repo, name: label.name });
                await github.rest.issues.updateLabel(params);
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel(params);
              }
              core.info("Synced label: " + label.name);
            }
