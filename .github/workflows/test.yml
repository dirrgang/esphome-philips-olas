name: Protocol unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check mise.toml syntax
        run: python3 -c "import tomllib; tomllib.load(open('mise.toml', 'rb'))"
      - name: C++17 host tests
        run: ./scripts/test.sh
  profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned ESPHome CLI
        run: python -m pip install esphome==2026.10.1
      - name: Profile isolation and target selection
        run: python -m unittest discover -s tests -p test_profiles.py
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Receive-only core host tests
        run: mise run test-core
      - name: ESPHome schema and typed references
        run: mise run test-schema
