name: ESPHome firmware validation

on:
  pull_request:
    paths:
      - .github/workflows/esphome.yml
      - mise.toml
      - components/**
      - esphome/**
      - scripts/ci_config_smoke.py
      - tests/fixtures/**
  push:
    branches: [main]
    paths:
      - .github/workflows/esphome.yml
      - mise.toml
      - components/**
      - esphome/**
      - scripts/ci_config_smoke.py
      - tests/fixtures/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned mise tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Check ESPHome toolchain
        run: mise run version
      - name: Validate public synthetic gateway fixture
        run: mise run config
      - name: Reject a deliberately broken include
        run: mise run smoke-config
      - name: Compile ESP32-S2 synthetic firmware (no upload)
        run: mise run compile
      - name: Validate public synthetic multi-device fixture
        run: mise run config-multi
      - name: Compile synthetic multi-device gateway (no upload)
        run: mise run compile-multi
