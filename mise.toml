# Development tools for the ESP32-S2/CC1101 ESPHome gateway.
# ESPHome is installed as an isolated CLI, not into a project virtualenv.
[tools]
python = "3.13"
uv = "0.12.10"
"pypi:esphome" = "2026.10.1"

[tasks.test]
description = "Run the C++17 protocol and multi-device core tests"
run = "bash scripts/test.sh"

[tasks.config]
description = "Validate the ESPHome reference YAML (requires local secrets.yaml)"
run = "esphome config esphome/olas-rf-gateway.yaml"

[tasks.compile]
description = "Compile the ESPHome firmware (requires local secrets.yaml)"
run = "esphome compile esphome/olas-rf-gateway.yaml"

[tasks.version]
description = "Display the pinned ESPHome version"
run = "esphome version"

[tasks.test-schema]
description = "Test Olas schema and typed ID validation with the pinned ESPHome CLI"
run = "python tests/test_config.py"

[tasks.config-core]
description = "Validate the synthetic, receive-only external-component fixture"
run = "esphome config tests/fixtures/olas-core.yaml"

[tasks.compile-core]
description = "Compile the synthetic external-component fixture (never flashes)"
run = "esphome compile tests/fixtures/olas-core.yaml"
