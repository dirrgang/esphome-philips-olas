# Development tools for the ESP32-S2/CC1101 ESPHome gateway.
# ESPHome is installed as an isolated CLI, not into a project virtualenv.
[tools]
python = "3.13"
uv = "0.12.10"
"pypi:esphome" = "2026.10.1"
# Zig supplies a standalone C++ compiler on Windows; Unix uses the system c++.
zig = { version = "0.15.2", os = ["windows"] }

[tasks.test]
description = "Run the C++17 protocol tests (requires Bash and a C++ compiler)"
shell = "bash -c"
run = "bash scripts/test.sh"

[tasks.config]
description = "Validate the shared gateway with synthetic configuration"
run = "esphome config esphome/validation.yaml"

[tasks.compile]
description = "Compile the shared gateway with synthetic configuration; never flash"
run = "esphome compile esphome/validation.yaml"

[tasks.version]
description = "Display the pinned ESPHome version"
run = "esphome version"

[tasks.rf-diagnose]
description = "Interactive generic RF-proxy diagnostic; receive-only by default"
run = "uv run --script scripts/rf_proxy_diagnose.py"

[tasks.test-profiles]
description = "Test private profile isolation and OTA/serial target selection"
run = "python -m unittest discover -s tests -p test_profiles.py"

[tasks.config-local]
description = "Validate a private local gateway profile"
run = "python scripts/local.py config"

[tasks.compile-local]
description = "Compile a private local gateway profile; does not upload"
run = "python scripts/local.py compile"

[tasks.init-local]
description = "Create an ignored hardware-test profile; preserve existing files"
run = "python scripts/local.py init"

[tasks.logs-local]
description = "Read logs from a private hardware-test profile"
run = "python scripts/local.py logs"

[tasks.upload-local]
description = "Upload the compiled private profile to real hardware"
run = "python scripts/local.py upload"

[tasks.install-local]
description = "Compile a selected private profile, then install via its OTA/serial target"
run = "python scripts/local.py install"

[tasks.smoke-config]
description = "Check that ESPHome rejects a deliberately broken synthetic include (offline)"
run = "python scripts/ci_config_smoke.py"
