# Development tools for the ESP32-S2/CC1101 ESPHome gateway.
# ESPHome is installed as an isolated CLI, not into a project virtualenv.
[tools]
python = "3.13"
uv = "0.12.10"
"pypi:esphome" = "2026.10.1"
# Zig supplies a standalone C++ compiler on Windows; Unix uses the system c++.
zig = { version = "0.15.2", os = ["windows"] }

[tasks.test]
description = "Run the C++17 protocol tests (requires Bash and a C++ compiler)"
shell = "bash -c"
run = "bash scripts/test.sh"

[tasks.config]
description = "Validate the ESPHome reference YAML (requires local secrets.yaml)"
run = "esphome config esphome/olas-rf-gateway.yaml"

[tasks.compile]
description = "Compile the ESPHome firmware (requires local secrets.yaml)"
run = "esphome compile esphome/olas-rf-gateway.yaml"

[tasks.version]
description = "Display the pinned ESPHome version"
run = "esphome version"

[tasks.config-local]
description = "Validate a private local gateway profile"
run = 'esphome config "{{ env.OLAS_LOCAL_CONFIG | default(value="esphome/local/gateway.yaml") }}"'

[tasks.compile-local]
description = "Compile a private local gateway profile; does not upload"
run = 'esphome compile "{{ env.OLAS_LOCAL_CONFIG | default(value="esphome/local/gateway.yaml") }}"'

[tasks.init-local]
description = "Create an ignored hardware-test profile; preserve existing files"
run = "python scripts/init-local.py"

[tasks.logs-local]
description = "Read logs from a private hardware-test profile"
run = 'esphome logs "{{ env.OLAS_LOCAL_CONFIG | default(value="esphome/local/gateway.yaml") }}" --device "{{ env.OLAS_DEVICE | default(value="OTA") }}"'

[tasks.upload-local]
description = "Upload the compiled private profile to real hardware"
run = 'esphome upload "{{ env.OLAS_LOCAL_CONFIG | default(value="esphome/local/gateway.yaml") }}" --device "{{ env.OLAS_DEVICE | default(value="OTA") }}"'
